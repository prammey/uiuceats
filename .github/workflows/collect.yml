name: Collect free food events

on:
  schedule:
    # Four times an hour: GitHub skips most scheduled runs on free repos (Nov 2026: an hourly
    # schedule ran only 3-4 times a day), so each hour gets four chances. The `gate` job lets
    # only the first run in each clock hour fetch the feeds, and collector/publish_gate.py only
    # commits (and so only redeploys) when listings change or the last refresh is ~3 hours old.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # Has this clock hour (UTC) already been collected? A finished collection leaves a cache
  # entry named after its hour; finding it means the campus feeds need not be fetched again.
  gate:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.hour.outputs.stamp }}
      done: ${{ steps.marker.outputs.cache-hit }}
    steps:
      - id: hour
        run: echo "stamp=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - id: marker
        uses: actions/cache/restore@v4
        with:
          path: .collected
          key: collected-${{ steps.hour.outputs.stamp }}
          lookup-only: true

  collect:
    needs: gate
    if: needs.gate.outputs.done != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Run tests
        run: python -m pytest -q collector/tests

      - name: Run collector
        env:
          # Google Sheets published as CSV; empty until the forms exist.
          PROMOTED_CSV_URL: ${{ vars.PROMOTED_CSV_URL }}
          REPORTS_CSV_URL: ${{ vars.REPORTS_CSV_URL }}
        run: python -m collector

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          if ! python -m collector.publish_gate; then
            exit 0
          fi
          git commit -m "data: refresh events $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Someone may have pushed code while this run was collecting.
          git pull --rebase origin main
          git push

      - name: Mark this hour as collected
        run: date -u > .collected
      - uses: actions/cache/save@v4
        with:
          path: .collected
          key: collected-${{ needs.gate.outputs.stamp }}
