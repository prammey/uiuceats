name: Collect free food events

on:
  schedule:
    # Hourly: GitHub skips or delays many scheduled runs on free repos, so checking every
    # hour keeps the site within ~3 hours. collector/publish_gate.py only commits (and so only
    # redeploys) when listings change or the last published refresh is ~3 hours old.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Run tests
        run: python -m pytest -q collector/tests

      - name: Run collector
        env:
          # Google Sheets published as CSV; empty until the forms exist.
          PROMOTED_CSV_URL: ${{ vars.PROMOTED_CSV_URL }}
          REPORTS_CSV_URL: ${{ vars.REPORTS_CSV_URL }}
        run: python -m collector

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          if ! python -m collector.publish_gate; then
            exit 0
          fi
          git commit -m "data: refresh events $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Someone may have pushed code while this run was collecting.
          git pull --rebase origin main
          git push
