<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" width="340" height="330">
  <!-- Retro cartoon take on the Illinois kingfisher logo: navy head with spiky crest, white
       collar, orange breast band, white belly, long open beak, orange outline. Perched and
       facing left; the raised wing ends in an open hand so a food emoji can sit in front of it. -->
  <defs>
    <clipPath id="body"><ellipse cx="178" cy="206" rx="74" ry="76"/></clipPath>
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="fat"/>
      <feFlood flood-color="#ff5f05" result="orange"/>
      <feComposite in="orange" in2="fat" operator="in" result="ring"/>
      <feMerge><feMergeNode in="ring"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#outline)" stroke="#0b1a33" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail feathers, trailing down and back -->
    <path d="M236 236 L318 262 L300 290 L226 262 Z" fill="#13294b"/>
    <path d="M232 250 L300 300 L276 316 L220 268 Z" fill="#13294b"/>
    <path d="M268 262 L276 276 M290 272 L298 286" stroke="#ffffff" stroke-width="6"/>

    <!-- legs and feet -->
    <path d="M160 272 L156 300 M184 272 L186 300" stroke="#ff5f05" stroke-width="9"/>
    <path d="M156 300 L136 310 M156 300 L154 316 M156 300 L172 312 M186 300 L204 310 M186 300 L190 316 M186 300 L170 312" stroke="#ff5f05" stroke-width="8"/>
    <path d="M160 272 L156 300 M184 272 L186 300 M156 300 L136 310 M156 300 L154 316 M156 300 L172 312 M186 300 L204 310 M186 300 L190 316 M186 300 L170 312" stroke="#0b1a33" stroke-width="2.5" fill="none"/>

    <!-- body: white belly with the orange breast band clipped to it -->
    <ellipse cx="178" cy="206" rx="74" ry="76" fill="#ffffff"/>
    <g clip-path="url(#body)" stroke="none">
      <path d="M90 168 C 130 150, 230 150, 270 168 L 270 206 C 230 220, 130 220, 90 206 Z" fill="#ff5f05"/>
    </g>
    <path d="M104 168 C 134 154, 222 154, 252 168" fill="none"/>
    <path d="M104 206 C 134 220, 222 220, 252 206" fill="none"/>

    <!-- folded back wing with a white wing bar -->
    <path d="M196 150 C 252 140, 278 190, 258 252 C 236 236, 212 200, 198 166 Z" fill="#13294b"/>
    <path d="M228 176 L244 196" stroke="#ffffff" stroke-width="7"/>

    <!-- white collar -->
    <path d="M100 150 C 120 136, 200 136, 222 150 C 206 166, 118 166, 100 150 Z" fill="#ffffff"/>

    <!-- head -->
    <circle cx="138" cy="96" r="52" fill="#13294b"/>
    <!-- spiky crest sweeping back -->
    <path d="M126 46 L140 10 L152 46 L182 20 L174 56 L210 48 L188 76 L154 68 Z" fill="#13294b"/>

    <!-- eye: white almond, pupil, fierce brow -->
    <path d="M92 88 C 104 72, 132 74, 138 90 C 130 102, 104 104, 92 88 Z" fill="#ffffff" stroke-width="4"/>
    <circle cx="116" cy="90" r="8" fill="#0b1a33" stroke="none"/>
    <circle cx="113" cy="86" r="2.6" fill="#ffffff" stroke="none"/>
    <path d="M90 76 L134 70" stroke-width="6"/>

    <!-- long beak, open and ready -->
    <path d="M90 98 L6 108 L92 114 Z" fill="#13294b"/>
    <path d="M90 120 L18 132 L94 130 Z" fill="#13294b"/>
    <path d="M28 108 L80 104" stroke="#ffffff" stroke-width="4"/>
    <path d="M88 116 L92 122" stroke="#ff5f05" stroke-width="4"/>

    <!-- raised front wing: shoulder on the band, primaries fanning into an open hand under the beak -->
    <path d="M166 192 C 150 176, 122 160, 98 152 C 86 148, 70 150, 62 160 C 56 166, 60 174, 68 174 C 58 180, 58 192, 68 194 C 62 202, 70 212, 80 208 C 80 218, 94 222, 102 212 C 120 218, 146 214, 166 206 Z" fill="#13294b"/>
    <path d="M128 190 L150 198" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
