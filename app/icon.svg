<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- UIUC Eats mark: the kingfisher mascot's head on Illini orange, with the site's thick ink border. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ff5f05" stroke="#111111" stroke-width="4"/>
  <!-- crest sweeping back -->
  <path d="M18 27 L7 12 L22 20 L19 5 L29 19 L41 10 L36 25 Z" fill="#13294b"/>
  <!-- head -->
  <circle cx="28" cy="34" r="16" fill="#13294b"/>
  <!-- white collar -->
  <path d="M13 41 Q28 54 43 41 Q28 47 13 41 Z" fill="#ffffff"/>
  <!-- long open beak pointing right -->
  <path d="M38 27 L61 33 L38 41 Z" fill="#13294b"/>
  <path d="M44 33.5 L57 33.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- eye with orange brow -->
  <path d="M25 25 Q32 21 38 26" fill="none" stroke="#ff5f05" stroke-width="3" stroke-linecap="round"/>
  <circle cx="33" cy="30" r="4.4" fill="#ffffff"/>
  <circle cx="34.2" cy="30.4" r="2.2" fill="#111111"/>
</svg>
